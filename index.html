<meta charset="utf-8">
<title>Foka Fishing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* One-screen game: a 320x180 pixel canvas scaled up with nearest-neighbour, centred on a deep-sea ground. */
  :root { --ground: #0b1622; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center;
         padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
</style>
<canvas id="game" width="320" height="180" aria-label="Foka Fishing game. Arrow keys or WASD move the hook."></canvas>
<script>
'use strict';
// ================= constants =================
const W = 320, H = 180;
const SURF = 100, BED = 520, WORLD_H = 540;
const ICE_TOP = 92, ICE_EDGE = 124, SEAL_RIGHT = 118;
const MIN_SIZE = 12, START_SIZE = 34, MAX_SIZE = 100;
const HOOK_MIN_X = 130, HOOK_MAX_X = 314;
const JUMP_DUR = .9;
// the cavern inside the berg where the shark fight happens, the shaft she smashes down into it, and the shark's tunnel
const AR = { x0: 14, x1: 306, y0: SURF + 50, y1: SURF + 250 }, SH0 = 10, SH1 = 130, TUN = { y0: SURF + 104, y1: SURF + 136 };
let iceBroken = false;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function resize() {
  // fill the whole window; pixelated rendering keeps the pixels sharp at any scale
  const k = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * k + 'px';
  cv.style.height = H * k + 'px';
}
addEventListener('resize', resize);
resize();

// ================= helpers =================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function hash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const rgbCache = {};
function RGB(c) {
  if (typeof c !== 'string') return c;
  return rgbCache[c] || (rgbCache[c] = [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]);
}
function mix(a, b, t) {
  a = RGB(a); b = RGB(b);
  return [Math.round(lerp(a[0], b[0], t)), Math.round(lerp(a[1], b[1], t)), Math.round(lerp(a[2], b[2], t))];
}
const hex = c => typeof c === 'string' ? c : '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const inE = (u, v, cx, cy, rx, ry) => ((u - cx) / rx) ** 2 + ((v - cy) / ry) ** 2 <= 1;

// Pixel buffer that becomes a canvas sprite
function pixbuf(w, h) {
  const img = new ImageData(w, h), d = img.data;
  return {
    w, h,
    put(x, y, c) {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      c = RGB(c); const i = (y * w + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    },
    get(x, y) { return x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 0; },
    done() { const c = makeCanvas(w, h); c.getContext('2d').putImageData(img, 0, 0); return c; },
  };
}
function bresenham(x0, y0, x1, y1, fn) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let n = 0; n < 2000; n++) {
    fn(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

// ================= pixel font (3x5) =================
const FONT = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',
  F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',
  K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',
  P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',
  U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
  Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111',
  '9':'111101111001110',' ':'000000000000000','.':'000000000000010',',':'000000000010100',':':'000010000010000',
  '!':'010010010000010','?':'110001010000010','-':'000000111000000','+':'000010111010000','/':'001001010100100',
  "'":'010010000000000','%':'101001010100101','(':'010100100100010',')':'010001001001010','=':'000111000111000',
  '<':'001010100010001','>':'100010001010100','*':'000101010101000',
};
function glyphs(s, x, y, col, sc) {
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]] || FONT['?'];
    for (let p = 0; p < 15; p++) if (g.charCodeAt(p) === 49)
      ctx.fillRect(x + i * 4 * sc + (p % 3) * sc, y + ((p / 3) | 0) * sc, sc, sc);
  }
}
const tw = (s, sc = 1) => String(s).length * 4 * sc - sc;
function txt(s, x, y, col = '#ffffff', sc = 1, sh = '#0b1520') {
  s = String(s).toUpperCase(); x = Math.round(x); y = Math.round(y);
  if (sh) glyphs(s, x, y + sc, sh, sc);
  glyphs(s, x, y, col, sc);
}
const ctxt = (s, cx, y, col, sc = 1, sh) => txt(s, cx - tw(s, sc) / 2, y, col, sc, sh);

// ================= sound =================
let actx = null, muted = false;
function audio() {
  startMusic();
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (actx.state === 'suspended') actx.resume();
}
// ---- background music: "Cats in the Cold" by Mage Tears, looping. Drop the file at music/cats-in-the-cold.mp3 ----
const music = new Audio('music/cats-in-the-cold.mp3');
music.loop = true; music.volume = 0.35; music.preload = 'auto';
let musicStarted = false; // set once a user gesture has unlocked playback
function startMusic() {
  if (muted || !music.paused) return;
  const p = music.play();
  if (p && p.then) p.then(() => { musicStarted = true; }).catch(() => {});
}
function syncMusic() {
  if (muted || document.hidden) { if (!music.paused) music.pause(); }
  else if (musicStarted) startMusic();
}
function tone(f0, f1, dur, type = 'square', vol = 0.05, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.08, freq = 900) {
  if (!actx || muted) return;
  const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  src.connect(f).connect(g).connect(actx.destination); src.start();
}
const SFX = {
  plop() { tone(700, 300, 0.08, 'sine', 0.06); },
  bite() { tone(520, 900, 0.07); tone(900, 1300, 0.06, 'square', 0.04, 0.08); },
  splash() { noise(0.3, 0.12, 800); },
  chomp() { tone(240, 90, 0.07, 'square', 0.07); tone(220, 80, 0.07, 'square', 0.07, 0.13); tone(500, 1000, 0.15, 'triangle', 0.05, 0.28); },
  snap() { tone(1500, 120, 0.25, 'sawtooth', 0.05); },
  zap() { tone(1800, 300, 0.2, 'sawtooth', 0.04); tone(1200, 200, 0.2, 'square', 0.03, 0.05); },
  reel() { tone(1700, 1500, 0.015, 'square', 0.012); },
  die() { [440, 370, 311, 262, 196].forEach((f, i) => tone(f, f * 0.97, 0.3, 'triangle', 0.07, i * 0.25)); },
  crack() { noise(.5, .25, 300); tone(160, 40, .5, 'sawtooth', .12); tone(90, 30, .7, 'square', .08, .1); },
  roar() { tone(90, 60, .5, 'sawtooth', .1); noise(.4, .1, 200); },
  hit() { tone(200, 60, .18, 'square', .09); noise(.15, .12, 500); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, f, .18, 'square', .06, i * .13)); },
};

// ================= seal sprite (rasterized per size so pixels stay square) =================
const SEAL_PAL = { id: 'grey',
  ol: '#25303c', base: '#8c9eae', hi: '#b8c7d3', sh: '#62748a', belly: '#d2dce3', spot: '#5a6b7f',
  snout: '#a9b8c4', flip: '#5b6b7e', flipSh: '#46556a', eye: '#11161d', nose: '#1a2028',
  mouth: '#3a1a24', tongue: '#d9707f', whisk: '#eef3f6', white: '#ffffff',
};
// the Baikal nerpa look, also the skin she earns by feeding them: a plain steel-silver coat with no spots, a pale belly with a
// yellowish tinge, an extra-round body (plump), a domed head and huge glossy black eyes set low in the face
const NERPA_PAL = { ...SEAL_PAL, id: 'nerpa', ol: '#171d24', base: '#636d77', hi: '#929ca5', sh: '#404a54', belly: '#c9c7b7', snout: '#b0b3ac',
  flip: '#444e58', flipSh: '#303942', eye: '#07090c', nose: '#14181d', whisk: '#f2f4f0', plain: true, plump: .22, dome: .14, eyeR: 1.8, eyeU: .88, eyeV: .4, padR: 1.45 };
// her silhouette, traced from a photo of a hauled-out seal: long and low, back peaking behind the middle,
// a small neckless head with a blunt muzzle, hind flippers splayed up at the rear. Points are (u, v) in 0..1.
const SEAL_RATIO = .36;
const SEAL_TOP = [[.12, .33], [.2, .2], [.3, .1], [.42, .03], [.53, 0], [.66, .04], [.77, .1], [.84, .12], [.9, .15], [.94, .21], [.965, .3], [.975, .38], [.99, .41], [1, .47]];
const SEAL_BOT = [[.12, .64], [.18, .74], [.25, .83], [.35, .92], [.5, .96], [.7, .94], [.78, .87], [.86, .77], [.92, .71], [.96, .68], [.985, .64], [1, .58]];
const profile = (pts, u) => {
  for (let i = 1; i < pts.length; i++) if (u <= pts[i][0]) { const [u0, v0] = pts[i - 1], [u1, v1] = pts[i]; return v0 + (v1 - v0) * (u - u0) / (u1 - u0); }
  return pts[pts.length - 1][1];
};
// eating barely lengthens her: it mostly rounds her out. chonk runs from -.25 (starving, hollow belly) to 1 (mega seal),
// and `extra` is how many pixels the belly bulges below the base body shape
function sealDims(size) {
  const w = Math.max(10, Math.round(28 + size * .18));
  const chonk = size >= START_SIZE ? Math.min(1, (size - START_SIZE) / (MAX_SIZE - START_SIZE)) : -.25 * Math.min(1, (START_SIZE - size) / (START_SIZE - MIN_SIZE));
  const bh = Math.round(w * SEAL_RATIO), extra = Math.max(5 - bh, Math.round((chonk + (myPal().plump || 0)) * w * .45));
  return { w, bh, extra, h: bh + extra, chonk };
}
// how the extra bulk is spread along the body: a broad flat-bottomed roll over the middle, tapering into the tail and chin
const bulge = u => clamp(1 - ((u - .55) / .44) ** 4, 0, 1) * clamp((.99 - u) / .15, 0, 1);
// where a domed head rises above the base profile: over the skull, behind the eyes
const dome = u => u <= .74 || u >= 1 ? 0 : Math.sin(Math.PI * (u - .74) / .3);
const sealCache = new Map();
function sealSprite(size, mouth, eyes, ghost, pal = SEAL_PAL, extra = 0) {
  const SC = pal;
  const w = Math.max(10, Math.round(size)), key = w + '|' + extra + '|' + mouth + '|' + eyes + '|' + ghost + '|' + pal.id;
  const cached = sealCache.get(key);
  if (cached) return cached;
  // h is the base body height the shape is drawn in; the canvas is taller by `extra`, about a third of it rising into her back, the rest sagging below
  const h = Math.round(w * SEAL_RATIO), up = Math.round(Math.max(0, extra) * .35), E = (extra - up) / h, EU = up / h;
  const pad = Math.ceil(w * 0.1) + 1, cw = w + pad * 2, ch = h + extra + pad * 2;
  const U = x => (x - pad + 0.5) / w, V = y => (y - pad - up + 0.5) / h;
  const reg = new Uint8Array(cw * ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const u = U(x), v = V(y);
    let r = 0;
    if (u >= .12 && u <= 1 && v >= profile(SEAL_TOP, u) - bulge(u) * EU - dome(u) * (SC.dome || 0) && v <= profile(SEAL_BOT, u) + bulge(u) * E) r = u > .84 ? 2 : 1; // long low body, neckless head, belly sagging by her chonk
    if (inE(u, v, .962, .57, .048 * (SC.padR || 1), .12 * (SC.padR || 1))) r = 3; // puffy whisker pad, bulging below the nose (a blunt pale muzzle on some skins)
    if (!r && u >= 0 && u < .14 && v >= .3 + u * .9 && v <= .82 - u * 1.4      // hind flippers, a fan spreading out behind,
        && !(h >= 16 && u < .03 && Math.floor(v * h / 2) % 2)) r = 4;           // with toes at the tip once she is big enough
    if (!r && inE(u, v, .115, .3, .028, .1)) r = 4;                             // the upper hind flipper, cocked up
    if (inE(u, v, .44, .94 + bulge(.44) * E, .06, .05)) r = 4;                  // front flipper, gripping the rod, riding on the belly
    reg[y * cw + x] = r;
  }
  const at = (x, y) => (x < 0 || y < 0 || x >= cw || y >= ch) ? 0 : reg[y * cw + x];
  const pb = pixbuf(cw, ch);
  const dark = new Set([SC.ol, SC.eye, SC.nose, SC.mouth]);
  const put = (x, y, c) => pb.put(x, y, ghost ? (dark.has(c) ? '#8ea7c4' : '#eef5ff') : c);
  const k = Math.max(1, Math.round(w / 24)), cs = Math.max(3, w / 8);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
    const r = at(x, y);
    if (!r) {
      if (at(x + 1, y) || at(x - 1, y) || at(x, y + 1) || at(x, y - 1)) put(x, y, SC.ol);
      continue;
    }
    const u = U(x), v = V(y), lit = !at(x - k, y - k), shd = !at(x + k, y + k);
    let c;
    if (r === 4) {
      c = shd ? SC.flipSh : SC.flip;
      const above = at(x, y - 1);
      if (above === 1 || above === 2) c = SC.ol;
    } else {
      c = r === 3 ? (at(x, y - 1) === 2 || at(x - 1, y) === 2 ? SC.sh : SC.belly) : SC.base; // pale pad, creased where it meets the face
      if (r === 1 && (SC.plain // a plain coat pales over the whole underside; the spotted one has a belly patch
        ? u > .17 && u < .9 && v > profile(SEAL_BOT, u) + bulge(u) * E - (.3 + Math.max(0, E) * .4)
        : inE(u, v, .52, .95 + bulge(.52) * E, .34, .09 + Math.max(0, E) * .25))) c = SC.belly;
      if (r === 3 && w >= 30) { // rows of whisker roots on the pad
        const du = (u - .93) * w / 2.5, dv = (v - .5) * h / 2.5;
        if (du > 0 && Math.abs(du - Math.round(du)) < .2 && Math.abs(dv - Math.round(dv)) < .2 && hash(Math.round(du), Math.round(dv)) < .6) c = SC.plain ? SC.sh : SC.spot;
      }
      if (r !== 3 && !SC.plain) {
        const gx = Math.floor((x - pad) / cs), gy = Math.floor((y - pad) / cs);
        if (hash(gx, gy) < 0.3) {
          const sx = (gx + 0.3 + hash(gy, gx + 7) * 0.4) * cs, sy = (gy + 0.3 + hash(gx + 3, gy) * 0.4) * cs;
          if (Math.hypot(x - pad + 0.5 - sx, y - pad + 0.5 - sy) < Math.max(0.75, cs * 0.2)) c = SC.spot;
        }
      }
      if (r === 3) { if (!at(x + 1, y + 1)) c = SC.snout; } // the pad stays pale, only its rim shaded
      else if (shd) c = SC.sh; else if (lit) c = SC.hi;
    }
    put(x, y, c);
  }
  // mouth
  if (mouth) {
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const u = U(x), v = V(y), r = at(x, y);
      if ((r === 2 || r === 3) && u > 0.91) { // opens under the whisker pad
        const m = v - 0.68, d = u - 0.91;
        if (m > -d * 0.7 && m < d * 1.2) put(x, y, m > d * 0.4 ? SC.tongue : SC.mouth);
      }
    }
  } else {
    // a small downturned mouth tucked under the pad
    const x0 = Math.round(pad + 0.925 * w), x1 = Math.round(pad + 0.965 * w), my = Math.round(pad + up + 0.69 * h);
    for (let x = x0; x <= x1; x++) put(x, my, SC.ol);
    put(x0 - 1, my - 1, SC.ol);
  }
  // dark nose at the tip, nostril slit angled back
  const nx = pad + 0.99 * w, ny = pad + up + 0.46 * h, nr = Math.max(0.9, w * 0.02);
  for (let y = Math.floor(ny - nr - 1); y <= ny + nr + 1; y++) for (let x = Math.floor(nx - nr - 1); x <= nx + nr + 1; x++)
    if (Math.hypot(x + 0.5 - nx, y + 0.5 - ny) <= nr) put(x, y, SC.nose);
  if (nr >= 1.5) put(Math.floor(nx - nr * 0.6), Math.floor(ny + nr * 0.2), SC.ol);
  // eyes: big, round and glossy black
  const ex = pad + (SC.eyeU || 0.91) * w, ey = pad + up + (SC.eyeV || 0.31) * h, er = Math.max(1, w * 0.036 * (SC.eyeR || 1));
  if (eyes === 'open') {
    for (let y = Math.floor(ey - er - 1); y <= ey + er + 1; y++) for (let x = Math.floor(ex - er - 1); x <= ex + er + 1; x++)
      if (Math.hypot(x + 0.5 - ex, y + 0.5 - ey) <= er) put(x, y, SC.eye);
    if (er >= 1.2) put(Math.floor(ex + er * 0.3), Math.floor(ey - er * 0.4), SC.white);
    if (er >= 2.2 && SC.eyeR > 1) { put(Math.floor(ex + er * 0.3) - 1, Math.floor(ey - er * 0.4), SC.white); put(Math.floor(ex - er * 0.3), Math.floor(ey + er * 0.45), '#9fb3c4'); } // wet, glossy
    else if (er >= 2.5) put(Math.floor(ex - er * 0.4), Math.floor(ey + er * 0.4), SC.sh);
  } else if (eyes === 'blink') {
    for (let x = Math.floor(ex - er); x <= Math.floor(ex + er); x++) put(x, Math.floor(ey), SC.eye);
  } else {
    const n = Math.max(1, Math.round(er)), cx = Math.floor(ex), cy = Math.floor(ey);
    for (let i = -n; i <= n; i++) { put(cx + i, cy + i, SC.eye); put(cx + i, cy - i, SC.eye); }
  }
  // long pale whiskers sweeping forward off the pad, then drooping down
  if (w >= 18) {
    const all = [[.99, .52, 1.09, .6], [.99, .6, 1.08, .8], [.975, .65, 1.04, .95], [.96, .67, 1.0, 1.06], [.945, .68, .965, 1.1]];
    (w >= 42 ? all : w >= 34 ? all.slice(0, 3) : w >= 26 ? all.slice(0, 2) : all.slice(1, 2)).forEach(([u0, v0, u1, v1]) => {
      const x0 = pad + u0 * w, y0 = pad + up + v0 * h, x1 = pad + u1 * w, y1 = pad + up + v1 * h, n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 1.5);
      for (let i = Math.ceil(n * .25); i <= n; i++) { // quadratic sweep: out along the pad first, then down
        const q = i / n, a = (1 - q) ** 2, b = 2 * (1 - q) * q, c = q * q;
        put(a * x0 + b * x1 + c * x1, a * y0 + b * y0 + c * y1, SC.whisk);
      }
    });
  }
  const s = { c: pb.done(), pad, w, h: h + extra };
  sealCache.set(key, s);
  return s;
}

// ================= fish =================
const FISH = [
  { name: 'SPRAT', len: 8, ratio: .42, dmin: 6, dmax: 140, speed: 26, str: .15, w: 10, back: '#5f7f95', body: '#b8c7d1', belly: '#eef3f5', fin: '#8fa5b5', ol: '#2c3a46' },

function rodGeo(g, spin) {

function drawRodAndLine() {
  const r = rodGeo(sealGeo(), true);
  // rod: quadratic curve, thicker at the handle
  const n = Math.ceil(Math.hypot(r.tx - r.bx, r.ty - r.by) * 1.5);
  let reelAt = null;
  for (let i = 0; i <= n; i++) {
    const q = i / n, a = (1 - q) ** 2, b = 2 * (1 - q) * q, c = q * q;
    const x = a * r.bx + b * r.cx + c * r.tx, y = a * r.by + b * r.cy + c * r.ty;
    const col = q < .22 ? '#3c2414' : q < .3 ? '#c9a067' : '#8a5a2c';
    px(x, y, col);
    if (q < .45) px(x + 1, y, q < .22 ? '#2a180c' : '#6b4320');
    if (!reelAt && q >= .18) reelAt = [x, y];
  }
  px(r.tx, r.ty, '#e04a3a');
  ctx.fillStyle = '#9aa4ad'; ctx.fillRect(Math.round(reelAt[0]) - 3, Math.round(reelAt[1]) - CY, 3, 3);
  ctx.fillStyle = '#5d6670'; ctx.fillRect(Math.round(reelAt[0]) - 2, Math.round(reelAt[1]) + 1 - CY, 1, 1);

  // line: rod tip -> bobber (sagging) -> hook
  const under = hook.y > SURF + 2;
  const bob = under
    ? { x: hook.x + clamp(-hook.vx * .08, -4, 4), y: surfaceAt(hook.x) - 2 + (bobDip > 0 ? 2 : 0) }
    : { x: hook.x, y: Math.max(r.ty + 2, hook.y - 9) };
  const hot = tension > .65 && Math.floor(t * 12) % 2;
  const lineCol = hot ? '#ff5a4a' : hex(mix('#f2efe6', '#ff8a6a', clamp(tension, 0, 1)));
  const sag = (1 - Math.min(1, tension * 1.5)) * Math.min(14, Math.hypot(bob.x - r.tx, bob.y - r.ty) * .18);
  const mx = (r.tx + bob.x) / 2, my = (r.ty + bob.y) / 2 + sag;
  let prev = [r.tx, r.ty];
  for (let i = 1; i <= 16; i++) {
    const q = i / 16, a = (1 - q) ** 2, b = 2 * (1 - q) * q, c = q * q;
    const p = [a * r.tx + b * mx + c * bob.x, a * r.ty + b * my + c * bob.y];
    bresenham(prev[0], prev[1], p[0], p[1], (x, y) => px(x, y, lineCol));
    prev = p;
  }
  bresenham(bob.x, bob.y + 2, hook.x, hook.y - 4, (x, y) => px(x, y, y > SURF ? (hot ? '#ff5a4a' : '#bcd6dc') : lineCol));
  // bobber
  const bx = Math.round(bob.x) - 1, by = Math.round(bob.y) - CY;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(bx, by - 1, 3, 2);
  ctx.fillStyle = '#e03a30'; ctx.fillRect(bx, by + 1, 3, 2);
  ctx.fillStyle = '#2a1a14'; ctx.fillRect(bx + 1, by - 2, 1, 1);
  // hook + worm
  const hx = Math.round(hook.x), hy = Math.round(hook.y) - CY;
  ctx.fillStyle = hook.stun > 0 && Math.floor(t * 20) % 2 ? '#fff27a' : '#c8d0d8';
  [[0, -4], [0, -3], [0, -2], [0, -1], [-1, 0], [-2, -1], [-2, -2]].forEach(([dx, dy]) => ctx.fillRect(hx + dx, hy + dy, 1, 1));
  if (!hooked) {
    const wig = Math.floor(t * 4) % 2;
    ctx.fillStyle = '#e8838f';
    ctx.fillRect(hx + 1, hy - 2 + wig, 1, 1); ctx.fillRect(hx + 1, hy - 1, 1, 1); ctx.fillRect(hx, hy + 1, 1, 1); ctx.fillRect(hx - 1, hy + 1 - wig, 1, 1);
  }
  if (hooked && hooked.thrash > 0 && Math.floor(t * 6) % 2) txt('!', hx - 1, hy - 14, '#ff5040');
}

  ctx.globalAlpha = 1;
  for (const j of jellies) drawJelly(j);
  for (const f of fishes) if (f !== hooked) drawFish(f);
  if (hooked) drawFish(hooked);
  if (iceBroken) { drawMinions(); drawSeal(); drawShark(); }
  ctx.drawImage(shade, 0, CY, W, H, 0, 0, W, H);
  // anglerfish lures glow through the deep-water darkness
  for (const f of fishes) if (f.T.lure && f.T.spr && Math.sin(t * 3 + f.ph) > -.5) {
    const lx = Math.round(f.x + f.dir * f.T.len * .47), ly = Math.round(f.y - f.T.spr.h / 2 - .5 - CY);
    ctx.fillStyle = '#fff27a';
    ctx.globalAlpha = .16; ctx.fillRect(lx - 3, ly - 3, 7, 7);
    ctx.globalAlpha = .3; ctx.fillRect(lx - 2, ly - 2, 5, 5);
    ctx.globalAlpha = 1;
  }
  drawSurface();
  drawIceChunks();
  if (!iceBroken && CY < ICE_TOP + 4) drawSeal();
  if (iceBroken) drawLostRod(); else drawRodAndLine();
  drawFlights();
  drawGhost();
  ctx.fillStyle = '#ffffff';
  for (const f of flakes) { const y = Math.round(f.y - CY); if (y >= 0 && y < H) ctx.fillRect(Math.round(f.x), y, 1, 1); }
  drawParts();
  ctx.restore();
  if (state !== 'title') drawHUD();
  drawJournalButton();
  if (state === 'title') drawTitle();
  if (state === 'dead') drawDead();
  if (state === 'won') drawWon();
  if (journalOpen) drawJournal();
  if (paused) {
    ctx.fillStyle = 'rgba(8,16,28,.5)'; ctx.fillRect(0, 0, W, H);
    ctxt('PAUSED', W / 2, 80, '#ffffff', 3);
    ctxt('P OR TAP TO RESUME   M: SOUND ' + (muted ? 'OFF' : 'ON'), W / 2, 104, '#cfe6ff');
  }
}

// ================= main loop =================
reset();
state = 'title';
// dev shortcut: open index.html#boss to jump straight into the shark fight with a well-fed seal (skips the journal, nothing is saved by the jump itself)
if (location.hash === '#boss') { state = 'play'; seal.size = seal.disp = 70; breakIce(); }
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (!paused && !journalOpen && !travelOpen) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
